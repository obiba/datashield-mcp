[project]
name = "datashield-mcp"
version = "0.1.0"
description = "A MCP server to interact with DataSHIELD"
readme = "README.md"
authors = [
    { name = "Yannick Marcon", email = "yannick.marcon@obiba.org" }
]
requires-python = ">=3.11"
dependencies = [
    "datashield>=0.5.1",
    "datashield-opal>=0.3.0",
    "datashield-base>=0.1.1",
    "datashield-tidyverse>=0.1.0",
    "mcp[cli]>=1.26.0",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
test = [
    "pytest>=7.2.2",
]
dev = [
    "ruff>=0.10.0",
]

[project.scripts]
datashield-mcp = "datashield_mcp.server:main"

[project.urls]
Homepage = "https://www.datashield.org"
Repository = "https://github.com/obiba/datashield-mcp"
Documentation = "https://obiba.org/datashield-mcp"
"Bug Tracker" = "https://github.com/obiba/datashield-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datashield_mcp"]

[tool.hatch.metadata]
allow-direct-references = true