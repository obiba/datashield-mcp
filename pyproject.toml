[project]
name = "datashield-mcp"
version = "0.1.0"
description = "A MCP server to interact with DataSHIELD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datashield-opal>=0.3.0",
    "mcp[cli]>=1.26.0",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
test = [
    "pytest>=7.2.2",
]
dev = [
    "ruff>=0.10.0",
]

[project.scripts]
datashield-mcp = "datashield_mcp.server:main"

[project.urls]
Homepage = "https://www.datashield.org"
Repository = "https://github.com/obiba/datashield-mcp"
Documentation = "https://obiba.org/datashield-mcp"
"Bug Tracker" = "https://github.com/obiba/datashield-mcp/issues"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datashield_mcp"]

[tool.hatch.metadata]
allow-direct-references = true